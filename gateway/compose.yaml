name: agatlas-access
services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      - guacd
    ports:
      - "127.0.0.1:8088:8080"
    env_file:
      - ../data/guacamole.env
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
